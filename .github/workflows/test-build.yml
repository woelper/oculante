name: Test build

# Release builds of this branch for Windows and Linux, to try before a release
# candidate. The binaries are artifacts of the run, nothing is released.
on:
  push:
    branches: [test-build]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            file: target/release/oculante.exe
            name: oculante-windows-x64
          # an older glibc than the release build, so it runs on more systems
          - os: ubuntu-22.04
            file: target/release/oculante
            name: oculante-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - run: rustup update
      - name: Build
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.file }}
      - name: Installer
        if: runner.os == 'Windows'
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version-test" "/DNumericVersion=$($version.Split('-')[0])" "/DExe=$PWD\target\release\oculante.exe" "/O$PWD\dist" res\windows\oculante.iss
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: oculante-windows-setup
          path: dist/oculante_setup.exe
