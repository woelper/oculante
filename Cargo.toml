[package]
authors = ["Johann Woelper <woelper@gmail.com>"]
description = "A minimalistic image viewer with analysis and editing tools"
edition = "2024"
exclude = [
    ".github/*",
    "res/fonts/NotoSansSC-Regular.ttf",
    # icon.ico is compiled into the app
    "res/icons/*.png",
    "res/*.svg",
    "res/premult.png",
    "res/screen*.png",
    "res/*.avif",
    "res/*.gif",
    "res/tests/*",
    "res/screenshots/*",
    "res/previews/*",
]
keywords = ["graphics", "image", "viewer"]
license = "MIT"
name = "oculante"
readme = "README.md"
repository = "https://github.com/woelper/oculante/"
version = "0.9.6"

[package.metadata.bundle]
icon = ["res/icons/icon.ico"]
identifier = "com.github.woelper.oculante"
name = "oculante"

[dependencies]
env_logger = "0.11"
glam = "0.34"
eframe = { version = "0.36", default-features = false, features = ["glow"] }
egui_glow = "0.36"
glow = "0.17"
# === EGUI
egui = { version = "0.36", features = ["serde"] }
egui_plot = "0.37"
egui_extras = { version = "0.36", features = ["image", "file"] }

# === IMAGE FORMATS
avif-decode = { version = "3", optional = true }
bytemuck = { version = "1", optional = true }
turbojpeg = { version = "1.5", optional = true }
psd = "0.3"
quickraw = "0.1.6"
tiff = "0.11"
jxl-oxide = "0.12"
# Always build lcms2 (used by jxl-oxide) from source. Otherwise it links to the
# system library where there is one, which is then missing in our bundles (#810).
lcms2-sys = { version = "4", features = ["static"], optional = true }
# These 3 need to be updated together
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
libheif-rs = { version = "3", default-features = false, features = [
    "v1_19",
], optional = true }
# HEIC and HEIF in pure Rust, nothing to install or link
heic-rs = { version = "0.1.1", optional = true }
ktx2 = "0.5"
basis-universal = "0.3"
dds-rs = "0.7"
exr = "1.74"
gif = "0.14"
image = { version = "0.25.10", features = ["hdr"] }
jpeg2k = { version = "0.10", optional = true, default-features = false, features = [
    "threads",
    "file-io",
    "openjpeg-sys",
] }
icns = "0.5"
# dicom needs to be the same version
dicom-pixeldata = { version = "0.10", features = ["image"] }
dicom-object = "0.10"
libavif-image = { version = "0.14", optional = true }
gif-dispose = "6.0"

# === FILTER CRATES
palette = "0.7"
lutgen = "0.15"
quantette = { version = "0.6", features = ["threads"] }
ase-swatch = "0.1.0"
libblur = "0.24"
imageproc = { version = "0.27", features = ["rayon"] }
evalexpr = "13"
fast_image_resize = { version = "6.1", features = ["rayon"] }

# APP FUNCTIONALITY CRATES
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.12"
rfd = { version = "0.17", optional = true }
rgb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
webbrowser = "1.2"
thiserror = "2.0"
img-parts = "0.4"                                                                                                        # for exif saving
trash = "5.2"
flate2 = "1.1"                                                                                                           # for KTX
bitflags = "2.13"                                                                                                         # for KTX
wgpu-types = "30" # for KTX, the names of the texture formats
ruzstd = "0.9"                                                                                                           # for KTX
mouse_position = "0.1.4"
file-format = "0.29"
zip = "8.6"
sysinfo = "0.39"
unicode-segmentation = "1.13.3"
font-kit = "0.14"
open = "5.4"
kamadak-exif = "0.6"
lexical-sort = "0.3"
log = "0.4"
nalgebra = "0.35"
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
clap = "4.6"                                                                                                             # DO NOT UPDATE unless you test extensively on mac. This will break the mac app.
dirs = "7.0"
num-integer = "0.1.46"
image-extras = "0.1.1"

[features]
default = ["turbo", "avif_native", "j2k", "jxlcms", "heif_native"]
heif = ["libheif-rs"]
# HEIC and HEIF without libheif, in pure Rust. This is what a plain build uses,
# so Linux builds open these files without anything installed. If `heif` is
# enabled as well, libheif is used.
heif_native = ["dep:heic-rs"]
avif_native = ["avif-decode", "bytemuck"]
dav1d = ["libavif-image"]
file_open = ["rfd"]
turbo = ["turbojpeg"]
j2k = ["jpeg2k"]
jxlcms = ["jxl-oxide/lcms2", "dep:lcms2-sys"]
hdr = []
lang_support = []

[target.'cfg(target_os = "macos")'.dependencies]
# For the files that Finder hands to the app, see src/mac.rs
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSString",
    "NSUserDefaults",
] }
# The same winit that eframe uses, to create the event loop ourselves
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
] }

[target.'cfg(any(target_os = "freebsd", target_os = "netbsd"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "x11",
] }

[build-dependencies]
winres = "0.1"

[dev-dependencies]
# to write test images the image crate can not write, already used by it
png = "0.18"
criterion = { version = "0.8", features = ["html_reports", "stable"] }

[profile.release]
opt-level = 3
lto = "fat"
debug = false
strip = true
codegen-units = 1
# panic = "abort"

[profile.dev]
debug = false
opt-level = 0
lto = false
codegen-units = 64
incremental = true

# The AVIF decoder, unoptimized it takes seconds for a photo
[profile.dev.package.rav1d]
opt-level = 2
debug-assertions = false

[profile.dev.package.yuv]
opt-level = 2
debug-assertions = false


[[bench]]
name = "my_benchmark"
harness = false

[patch.crates-io]
# heic-rs 0.1.1 decodes photos from phones with the wrong contrast and colour:
# it ignores what the video stream says about range and matrix when the file
# has no colr box. Fixed in tbraun96/heic-rs#7 and #8. Remove this once a
# release contains both.
heic-rs = { git = "https://github.com/woelper/heic-rs", branch = "oculante" }
# avif-parse 2.1.0 refuses AVIFs whose last box has the size 0, which means it runs
# to the end of the file. Lightroom writes its AVIF exports like that. Fixed in
# kornelski/avif-parse#4, remove this once a release contains it.
avif-parse = { git = "https://github.com/woelper/avif-parse", branch = "oculante" }
