[package]
authors = ["Johann Woelper <woelper@gmail.com>"]
description = "A minimalistic image viewer with analysis and editing tools"
edition = "2024"
exclude = [
    ".github/*",
    "res/fonts/NotoSansSC-Regular.ttf",
    # icon.ico is compiled into the app
    "res/icons/app/*.png",
    "res/*.svg",
    "res/premult.png",
    "res/screen*.png",
    "res/*.avif",
    "res/*.gif",
    "res/tests/*",
    "res/screenshots/*",
    "res/previews/*",
]
keywords = ["graphics", "image", "viewer"]
license = "MIT"
name = "oculante"
readme = "README.md"
repository = "https://github.com/woelper/oculante/"
version = "1.0.0-rc.2"
# avif-decode 3 needs it, checked with 1.98.0
rust-version = "1.98"

[package.metadata.bundle]
icon = ["res/icons/app/icon.ico"]
identifier = "com.github.woelper.oculante"
name = "oculante"

[package.metadata.deb]
section = "graphics"
assets = [
    ["target/release/oculante", "usr/bin/", "755"],
    ["res/oculante.desktop", "usr/share/applications/", "644"],
    ["res/icons/app/icon.png", "usr/share/icons/hicolor/256x256/apps/oculante.png", "644"],
    ["README.md", "usr/share/doc/oculante/", "644"],
]

[dependencies]
env_logger = "0.11"
glam = "0.34"
eframe = { version = "0.36", default-features = false, features = ["glow"] }
egui_glow = "0.36"
glow = "0.17"
# === EGUI
egui = { version = "0.36", features = ["serde"] }
egui_plot = "0.37"
egui_extras = { version = "0.36", features = ["image", "file"] }

# === IMAGE FORMATS
avif-decode = { version = "3", optional = true }
bytemuck = { version = "1", optional = true }
turbojpeg = { version = "1.5", optional = true }
psd = "0.3"
quickraw = "0.1.6"
tiff = "0.11"
jxl-oxide = "0.12"
# These 3 need to be updated together
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
# HEIC and HEIF in pure Rust, nothing to install or link
heic-rs = { version = "0.1.1", optional = true }
ktx2 = "0.5"
basisu = "0.1"
texture2ddecoder = "0.1"
dds-rs = "0.7"
exr = "1.74"
gif = "0.14"
image = { version = "0.25.10", features = ["hdr"] }
jpeg2k = { version = "0.10", optional = true, default-features = false, features = [
    "threads",
    "file-io",
    "openjpeg-sys",
] }
icns = "0.5"
# dicom needs to be the same version
dicom-pixeldata = { version = "0.10", features = ["image"] }
dicom-object = "0.10"
gif-dispose = "6.0"

# === FILTER CRATES
palette = "0.7"
lutgen = "0.15"
quantette = { version = "0.6", features = ["threads"] }
ase-swatch = "0.1.0"
libblur = "0.24"
imageproc = { version = "0.27", features = ["rayon"] }
evalexpr = "13"
fast_image_resize = { version = "6.1", features = ["rayon"] }

# APP FUNCTIONALITY CRATES
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.12"
rfd = { version = "0.17", optional = true }
rgb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0"
img-parts = "0.4"                                                                                                        # for exif saving
flate2 = "1.1"                                                                                                           # for KTX
ruzstd = "0.7"                                                                                                           # for KTX
file-format = "0.29"
# Krita files are read, they use deflate
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sysinfo = "0.39"
unicode-segmentation = "1.13.3"
# finds the fonts of the system, the same version as resvg uses
fontdb = "0.24"
open = "5.4"
kamadak-exif = "0.6"
lexical-sort = "0.3"
log = "0.4"
percent-encoding = "2"
# dates in the file list, in local time. Already used by dicom and trash.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nalgebra = "0.35"
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
clap = "4.6"                                                                                                             # DO NOT UPDATE unless you test extensively on mac. This will break the mac app.
dirs = "7.0"
num-integer = "0.1.46"
# dds, icns and ora are read by Oculante itself
image-extras = { version = "0.1.1", default-features = false, features = [
  "otb",
  "pcx",
  "sgi",
  "wbmp",
  "xbm",
  "xpm",
] }

[features]
default = ["turbo", "avif_native", "j2k", "jxlcms", "heif_native"]
# HEIC and HEIF in pure Rust, on by default
heif_native = ["dep:heic-rs"]
# libheif was used with this one until 1.0. It stays so builds that ask for it
# still work, and gives the same as heif_native.
heif = ["heif_native"]
avif_native = ["avif-decode", "bytemuck"]
# libavif and libdav1d were used with this one until 1.0. It stays so builds that
# ask for it still work, and gives the same as avif_native.
dav1d = ["avif_native"]
file_open = ["rfd"]
turbo = ["turbojpeg"]
j2k = ["jpeg2k"]
# colour management for JPEG XL, in pure Rust (moxcms)
jxlcms = ["jxl-oxide/moxcms"]
hdr = []
lang_support = []

[target.'cfg(target_os = "macos")'.dependencies]
# For the files that Finder hands to the app, see src/mac.rs
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSString",
    "NSUserDefaults",
] }
# The same winit that eframe uses, to create the event loop ourselves
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
] }

[target.'cfg(any(target_os = "freebsd", target_os = "netbsd"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = [
    "glow",
    "x11",
] }

# On FreeBSD and NetBSD a deleted file is removed instead and the window is not dragged
[target.'cfg(not(any(target_os = "freebsd", target_os = "netbsd")))'.dependencies]
trash = "5.2"
mouse_position = "0.1.4"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
# to write test images the image crate can not write, already used by it
png = "0.18"
dicom-core = "0.10"
criterion = { version = "0.8", features = ["html_reports", "stable"] }

[profile.release]
opt-level = 3
lto = "fat"
debug = false
strip = true
codegen-units = 1
# panic = "abort"

[profile.dev]
debug = false
opt-level = 0
lto = false
codegen-units = 64
incremental = true

# The AVIF decoder, unoptimized it takes seconds for a photo
[profile.dev.package.rav1d]
opt-level = 2
debug-assertions = false

[profile.dev.package.yuv]
opt-level = 2
debug-assertions = false


[[bench]]
name = "my_benchmark"
harness = false

[patch.crates-io]
# Both are pinned to a commit, so packagers who build offline can fetch them first.
#
# heic-rs 0.1.4 decodes photos from phones with the wrong contrast and colour:
# it ignores what the video stream says about range and matrix when the file
# has no colr box (tbraun96/heic-rs#7 and #8). It decodes only the primary image
# of a file (#9), and camera HIF in 4:2:2 (#10) and 4:4:4 (#12) do not decode right.
# The commit is the `oculante` branch of the fork, remove this once a release
# contains all of them.
heic-rs = { git = "https://github.com/woelper/heic-rs", rev = "5a8e7146aea6f216bff931ddd67ec4a77fe64384" }
# avif-parse 2.1.0 refuses AVIFs whose last box has the size 0, which means it runs
# to the end of the file. Lightroom writes its AVIF exports like that. Fixed in
# kornelski/avif-parse#4, remove this once a release contains it.
avif-parse = { git = "https://github.com/woelper/avif-parse", rev = "616d71b0597707e658d382f76bbf93961d4c411e" }
