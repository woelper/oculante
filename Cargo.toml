[package]
authors = ["Johann Woelper <woelper@gmail.com>"]
description = "A minimalistic image viewer with analysis and editing tools"
edition = "2024"
exclude = [
    ".github/*",
    "res/fonts/NotoSansSC-Regular.ttf",
    "res/icons/*",
    "res/*.svg",
    "res/premult.png",
    "res/screen*.png",
    "res/*.avif",
    "res/*.gif",
    "res/tests/*",
    "res/screenshots/*",
    "res/previews/*",
]
keywords = ["graphics", "image", "viewer"]
license = "MIT"
name = "oculante"
readme = "README.md"
repository = "https://github.com/woelper/oculante/"
version = "0.9.2"

[package.metadata.bundle]
icon = ["res/icons/icon.ico"]
identifier = "com.github.woelper.oculante"
name = "oculante"

[dependencies]
env_logger = "0.11"
glam = "0.33"
eframe = { version = "0.35", default-features = false, features = ["glow"] }
egui_glow = "0.35"
glow = "0.17"
# === EGUI
egui = { version = "0.35", features = ["serde"] }
egui_plot = "0.36"
egui_extras = { version = "0.35", features = ["image", "file"] }

# === IMAGE FORMATS
avif-decode = { version = "1.0", optional = true }
turbojpeg = { version = "1.5", optional = true }
psd = "0.3"
quickraw = "0.1.6"
tiff = "0.11"
jxl-oxide = "0.8"
# These 3 need to be updated together
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.12"
libheif-rs = { version = "2", default-features = false, features = [
    "v1_19",
], optional = true }
ktx2 = "0.3.0"
basis-universal = "0.3"
dds-rs = "0.7"
exr = "1.74"
gif = "0.13.3"
image = { version = "0.25.10", features = ["hdr"] }
jpeg2k = { version = "0.10", optional = true, default-features = false, features = [
    "threads",
    "file-io",
    "openjpeg-sys",
] }
icns = "0.4"
# dicom needs to be the same version
dicom-pixeldata = { version = "0.9", features = ["image"] }
dicom-object = "0.9"
libavif-image = { version = "0.14", optional = true }
gif-dispose = "5.0.1"

# === FILTER CRATES
palette = "0.7"
lutgen = { version = "0.11", features = ["lutgen-palettes"] }
quantette = { version = "0.3.0", features = ["threads"] }
ase-swatch = "0.1.0"
libblur = "0.14"
imageproc = { version = "0.26", features = ["rayon"] }
evalexpr = "13"
fast_image_resize = { version = "6.1", features = ["rayon"] }

# APP FUNCTIONALITY CRATES
rand = "0.10"
rand_chacha = "0.10"
rayon = "1.12"
rfd = { version = "0.17", optional = true }
rgb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
webbrowser = "1.2"
thiserror = "2.0"
img-parts = "0.4"                                                                                                        # for exif saving
trash = "5.2"
flate2 = "1.1"                                                                                                           # for KTX
bitflags = "2.13"                                                                                                         # for KTX
wgpu = "29"                                                                                                              # for KTX
ruzstd = "0.8"                                                                                                           # for KTX
mouse_position = "0.1.4"
file-format = "0.29"
zip = "8.6"
sysinfo = "0.39"
unicode-segmentation = "1.13.3"
font-kit = "0.14"
open = "5.4"
kamadak-exif = "0.6"
lexical-sort = "0.3"
log = "0.4"
nalgebra = "0.34"
anyhow = "1.0"
arboard = { version = "3.6", features = ["wayland-data-control"] }
clap = "4.6"                                                                                                             # DO NOT UPDATE unless you test extensively on mac. This will break the mac app.
dirs = "6.0"
num-integer = "0.1.46"
image-extras = "0.1.1"

[features]
default = ["turbo", "avif_native", "j2k", "jxlcms"]
heif = ["libheif-rs"]
avif_native = ["avif-decode"]
dav1d = ["libavif-image"]
file_open = ["rfd"]
turbo = ["turbojpeg"]
j2k = ["jpeg2k"]
jxlcms = ["jxl-oxide/lcms2"]
hdr = []
lang_support = []

[target.'cfg(target_os = "macos")'.dependencies]
fruitbasket = "0.10.0"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "glow",
    "x11",
    "wayland",
] }

[target.'cfg(any(target_os = "freebsd", target_os = "netbsd"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = [
    "glow",
    "x11",
] }

[target.'cfg(windows)'.build-dependencies]
# this currently causes a link error LNK1356, check in the future if the problem was solved
windres = "0.2"

[build-dependencies]
env_logger = "0.11"
log = "0.4.33"
winres = "0.1"
cc = "1.4.0"
cmake = "0.1"

[dev-dependencies]
cmd_lib = "2"
xmltree = "0.12"
chrono = "0.4.45"
criterion = { version = "0.5.1", features = ["html_reports", "stable"] }

[profile.release]
opt-level = 3
lto = "fat"
debug = false
strip = true
codegen-units = 1
# panic = "abort"

[profile.dev]
debug = false
opt-level = 0
lto = false
codegen-units = 64
incremental = true


[[bench]]
name = "my_benchmark"
harness = false
